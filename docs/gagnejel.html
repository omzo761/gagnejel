<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GagneJèl V2 - Paris Sportifs Web3</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #f9fafb;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes bounce {
            0%, 100% {
                transform: translateY(-5%);
                animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
            }
            50% {
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
            }
        }
        .animate-bounce {
            animation: bounce 1s infinite;
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: .5;
            }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icons Component (simplified versions)
        const Icons = {
            ChevronRight: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>,
            Home: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>,
            Users: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            History: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Wallet: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>,
            User: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
            Trophy: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" /></svg>,
            Bell: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>,
            Clock: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Calendar: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,
            MapPin: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
            Plus: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
            ArrowLeft: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>,
            Check: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>,
            X: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>,
            Shield: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
            Phone: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>,
            AlertCircle: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
        };

        const GagneJelV2 = () => {
            const [currentScreen, setCurrentScreen] = useState('onboarding1');
            const [phoneNumber, setPhoneNumber] = useState('');
            const [otpCode, setOtpCode] = useState(['', '', '', '', '', '']);
            const [walletBalance, setWalletBalance] = useState(1250.50);
            const [notification, setNotification] = useState('');
            const [selectedSport, setSelectedSport] = useState('all');
            const [selectedMatch, setSelectedMatch] = useState(null);
            const [showLeaderboard, setShowLeaderboard] = useState(false);
            const [userXP, setUserXP] = useState(2450);
            const [nextLevelXP, setNextLevelXP] = useState(3000);

            useEffect(() => {
                if (notification) {
                    const timer = setTimeout(() => setNotification(''), 3000);
                    return () => clearTimeout(timer);
                }
            }, [notification]);

            const sports = [
                { id: 'all', name: 'Tous', icon: '🌐', color: 'from-green-500 to-emerald-500' },
                { id: 'wrestling', name: 'Lutte', icon: '🤼', color: 'from-orange-500 to-yellow-500' },
                { id: 'football', name: 'Football', icon: '⚽', color: 'from-green-600 to-emerald-600' },
                { id: 'basketball', name: 'Basket', icon: '🏀', color: 'from-yellow-500 to-orange-500' },
                { id: 'mma', name: 'MMA', icon: '🥊', color: 'from-emerald-600 to-green-700' },
            ];

            const matches = [
                {
                    id: 1, sport: 'wrestling', team1: 'Modou Lô', team2: 'Balla Gaye 2', logo1: '🦁', logo2: '🐅',
                    date: '2025-02-15', time: '20:00', venue: 'Arène Nationale', odds1: 1.85, odds2: 2.20,
                    totalBets: 342, totalAmount: 48750.00, closesIn: '2h 30m', category: 'Combat Principal'
                },
                {
                    id: 2, sport: 'football', team1: 'Liverpool', team2: 'Man City', logo1: '🔴', logo2: '🔵',
                    date: '2025-02-10', time: '21:00', venue: 'Anfield', odds1: 2.10, odds2: 1.90,
                    totalBets: 567, totalAmount: 125340.50, closesIn: '45m', category: 'Premier League'
                },
                {
                    id: 3, sport: 'basketball', team1: 'Lakers', team2: 'Warriors', logo1: '💛', logo2: '💙',
                    date: '2025-02-08', time: '03:30', venue: 'Crypto Arena', odds1: 1.75, odds2: 2.35,
                    totalBets: 234, totalAmount: 67890.00, closesIn: '1h 15m', category: 'NBA'
                },
                {
                    id: 4, sport: 'mma', team1: 'Conor McGregor', team2: 'Dustin Poirier', logo1: '🥊', logo2: '💎',
                    date: '2025-02-20', time: '04:00', venue: 'T-Mobile Arena', odds1: 2.50, odds2: 1.65,
                    totalBets: 189, totalAmount: 98450.00, closesIn: '3h 20m', category: 'UFC 300'
                }
            ];

            const levels = [
                { name: 'Rookie', minXP: 0, maxXP: 100, icon: '🌱' },
                { name: 'Pro', minXP: 100, maxXP: 500, icon: '⚡' },
                { name: 'Expert', minXP: 500, maxXP: 2000, icon: '🔥' },
                { name: 'Legend', minXP: 2000, maxXP: 5000, icon: '👑' },
                { name: 'God', minXP: 5000, maxXP: null, icon: '⚡' }
            ];

            const leaderboard = [
                { rank: 1, username: 'AbdouTheBest', xp: 4850, wins: 127, winRate: 78, level: 'Legend', avatar: '👑' },
                { rank: 2, username: 'FatouQueen', xp: 3920, wins: 98, winRate: 72, level: 'Expert', avatar: '💎' },
                { rank: 3, username: 'Vous', xp: 2450, wins: 65, winRate: 68, level: 'Legend', avatar: '🔥' },
            ];

            const getCurrentLevel = () => {
                return levels.find(level => 
                    userXP >= level.minXP && (level.maxXP === null || userXP < level.maxXP)
                ) || levels[0];
            };

            const getProgressPercentage = () => {
                const currentLevel = getCurrentLevel();
                if (currentLevel.maxXP === null) return 100;
                return ((userXP - currentLevel.minXP) / (currentLevel.maxXP - currentLevel.minXP)) * 100;
            };

            const getSportIcon = (sportId) => {
                return sports.find(s => s.id === sportId)?.icon || '⭐';
            };

            const Logo = ({ size = 'normal', variant = 'color' }) => {
                const fontSize = size === 'large' ? 'text-5xl' : size === 'normal' ? 'text-3xl' : 'text-xl';
                const colorClass = variant === 'white' ? 'text-white' : 'text-green-600';
                
                return (
                    <div className={`font-black ${fontSize} tracking-tight`}>
                        <span className={colorClass}>Ga</span>
                        <span className="text-yellow-400">g</span>
                        <span className={colorClass}>neJël</span>
                    </div>
                );
            };

            const MobileContainer = ({ children }) => (
                <div className="w-full max-w-md mx-auto h-screen bg-gradient-to-b from-gray-50 to-gray-100 relative overflow-hidden">
                    {notification && (
                        <div className="absolute top-4 left-4 right-4 bg-gradient-to-r from-green-500 to-emerald-600 text-white p-4 rounded-xl z-50 shadow-2xl animate-bounce">
                            <div className="flex items-center gap-3">
                                <Icons.Check />
                                <span className="text-sm font-bold">{notification}</span>
                            </div>
                        </div>
                    )}
                    {children}
                </div>
            );

            const FooterNav = () => (
                <div className="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg">
                    <div className="flex justify-around py-3">
                        {[
                            { screen: 'home', Icon: Icons.Home, label: 'Accueil' },
                            { screen: 'groups', Icon: Icons.Users, label: 'Groupes' },
                            { screen: 'history', Icon: Icons.History, label: 'Historique' },
                            { screen: 'wallet', Icon: Icons.Wallet, label: 'Wallet' },
                            { screen: 'profile', Icon: Icons.User, label: 'Profil' }
                        ].map(({ screen, Icon, label }) => (
                            <button 
                                key={screen}
                                onClick={() => setCurrentScreen(screen)} 
                                className="flex flex-col items-center p-2 transition-all hover:scale-110"
                            >
                                <div className={currentScreen === screen ? 'text-green-600' : 'text-gray-400'}>
                                    <Icon />
                                </div>
                                <span className={`text-xs mt-1 ${currentScreen === screen ? 'text-green-600 font-semibold' : 'text-gray-400'}`}>
                                    {label}
                                </span>
                            </button>
                        ))}
                    </div>
                </div>
            );

            // ONBOARDING SCREEN
            if (currentScreen === 'onboarding1') {
                return (
                    <MobileContainer>
                        <div className="flex flex-col h-full bg-gradient-to-br from-green-600 via-green-700 to-emerald-800 p-6">
                            <div className="flex-1 flex flex-col items-center justify-center text-center">
                                <div className="mb-8 animate-bounce">
                                    <Logo size="large" variant="white" />
                                </div>
                                
                                <div className="bg-white/10 backdrop-blur-xl rounded-3xl p-8 mb-8 border border-white/20 shadow-2xl">
                                    <div className="text-6xl mb-4 animate-pulse">🎯</div>
                                    <h2 className="text-2xl font-bold text-white mb-3">Paris Sportifs Web3</h2>
                                    <p className="text-white/90 text-sm leading-relaxed">
                                        Pariez sur la Lutte, le Foot, le Basket, le MMA et plus encore.
                                        Créez des groupes illimités avec vos amis!
                                    </p>
                                </div>

                                <div className="w-full space-y-4">
                                    {[
                                        { Icon: Icons.Shield, title: 'Blockchain Sécurisée', subtitle: 'Transactions en USDT' },
                                        { Icon: Icons.Users, title: 'Groupes Illimités', subtitle: 'Pariez avec vos amis' },
                                        { Icon: Icons.Trophy, title: 'Système de Niveaux', subtitle: 'Gagnez XP et badges' }
                                    ].map(({ Icon, title, subtitle }, i) => (
                                        <div key={i} className="bg-white/10 backdrop-blur-xl rounded-2xl p-4 flex items-center gap-4 border border-white/20">
                                            <div className="bg-yellow-400 rounded-full p-3">
                                                <div className="text-white"><Icon /></div>
                                            </div>
                                            <div className="text-left">
                                                <p className="text-white font-semibold">{title}</p>
                                                <p className="text-white/80 text-xs">{subtitle}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <button 
                                onClick={() => setCurrentScreen('home')}
                                className="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-white py-4 rounded-2xl font-bold text-lg shadow-2xl hover:scale-105 transition-all flex items-center justify-center gap-2"
                            >
                                Commencer
                                <Icons.ChevronRight />
                            </button>
                        </div>
                    </MobileContainer>
                );
            }

            // HOME SCREEN
            if (currentScreen === 'home') {
                const filteredMatches = selectedSport === 'all' ? matches : matches.filter(m => m.sport === selectedSport);

                return (
                    <MobileContainer>
                        <div className="flex flex-col h-full">
                            <div className="bg-gradient-to-r from-green-600 to-emerald-600 p-6 pb-4">
                                <div className="flex items-center justify-between mb-4">
                                    <Logo variant="white" />
                                    <div className="flex items-center gap-3">
                                        <button 
                                            onClick={() => setShowLeaderboard(true)}
                                            className="bg-white/20 backdrop-blur-xl rounded-full p-2 hover:scale-110 transition-all"
                                        >
                                            <Icons.Trophy />
                                        </button>
                                        <button className="bg-white/20 backdrop-blur-xl rounded-full p-2 hover:scale-110 transition-all">
                                            <Icons.Bell />
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-white/10 backdrop-blur-xl rounded-2xl p-4 border border-white/20">
                                    <div className="flex items-center justify-between mb-3">
                                        <div className="flex items-center gap-3">
                                            <div className="text-3xl">{getCurrentLevel().icon}</div>
                                            <div>
                                                <p className="text-white font-bold text-lg">{getCurrentLevel().name}</p>
                                                <p className="text-white/80 text-sm">{userXP} / {nextLevelXP} XP</p>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-white/80 text-xs">Solde</p>
                                            <p className="text-white font-bold text-xl">${walletBalance.toFixed(2)}</p>
                                            <p className="text-white/60 text-xs">USDT</p>
                                        </div>
                                    </div>
                                    <div className="w-full bg-white/20 rounded-full h-2">
                                        <div 
                                            className="bg-gradient-to-r from-yellow-400 to-orange-500 h-2 rounded-full transition-all"
                                            style={{ width: `${getProgressPercentage()}%` }}
                                        />
                                    </div>
                                </div>
                            </div>

                            <div className="px-4 py-3 bg-white border-b border-gray-200">
                                <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                                    {sports.map(sport => (
                                        <button
                                            key={sport.id}
                                            onClick={() => setSelectedSport(sport.id)}
                                            className={`flex items-center gap-2 px-4 py-2 rounded-xl font-semibold whitespace-nowrap transition-all ${
                                                selectedSport === sport.id
                                                    ? `bg-gradient-to-r ${sport.color} text-white shadow-lg scale-105`
                                                    : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                            }`}
                                        >
                                            <span className="text-xl">{sport.icon}</span>
                                            <span>{sport.name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto p-4 pb-20">
                                {/* Matches Grid - 2 colonnes */}
                                <h3 className="text-lg font-black text-green-900 mb-3">Matches en Direct</h3>
                                <div className="grid grid-cols-2 gap-3 mb-6">
                                    {filteredMatches.map((match) => {
                                        const team1Favori = match.odds1 < match.odds2;
                                        return (
                                            <div 
                                                key={match.id}
                                                onClick={() => {
                                                    setSelectedMatch(match);
                                                    setNotification('Match sélectionné! 🎯');
                                                }}
                                                className="bg-white rounded-xl shadow-md hover:shadow-xl transition-all cursor-pointer overflow-hidden border-2 border-transparent hover:border-green-500"
                                            >
                                                {/* Header ultra compact */}
                                                <div className="bg-gradient-to-r from-gray-50 to-gray-100 px-2 py-1.5 border-b flex items-center justify-between">
                                                    <span className="text-lg">{getSportIcon(match.sport)}</span>
                                                    <div className="flex items-center gap-1">
                                                        <svg className="w-3 h-3 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                        </svg>
                                                        <span className="text-[10px] font-bold text-orange-600">{match.closesIn}</span>
                                                    </div>
                                                </div>

                                                {/* Teams ultra compact */}
                                                <div className="p-2.5">
                                                    <div className="space-y-1.5">
                                                        {/* Team 1 */}
                                                        <div className={`flex items-center gap-2 ${team1Favori ? 'opacity-100' : 'opacity-60'}`}>
                                                            <span className="text-xl">{match.logo1}</span>
                                                            <span className="font-bold text-green-900 text-xs truncate flex-1">{match.team1}</span>
                                                            {team1Favori && <span className="text-xs">⭐</span>}
                                                        </div>

                                                        <div className="text-center py-0.5">
                                                            <span className="text-[10px] font-black text-gray-400">VS</span>
                                                        </div>

                                                        {/* Team 2 */}
                                                        <div className={`flex items-center gap-2 ${!team1Favori ? 'opacity-100' : 'opacity-60'}`}>
                                                            <span className="text-xl">{match.logo2}</span>
                                                            <span className="font-bold text-green-900 text-xs truncate flex-1">{match.team2}</span>
                                                            {!team1Favori && <span className="text-xs">⭐</span>}
                                                        </div>
                                                    </div>

                                                    {/* Stats mini */}
                                                    <div className="flex items-center justify-center gap-3 pt-2 mt-2 border-t text-[10px]">
                                                        <div className="text-center">
                                                            <span className="text-gray-500">{match.totalBets} paris</span>
                                                        </div>
                                                        <span className="text-gray-300">•</span>
                                                        <div className="text-center">
                                                            <span className="text-green-600 font-bold">${(match.totalAmount / 1000).toFixed(1)}k</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Types de Paris */}
                                <h3 className="text-lg font-black text-green-900 mb-3">Types de Paris</h3>
                                <div className="space-y-3">
                                    {[
                                        { name: 'Pari DUO', icon: '👥', minBet: 10, multiplier: 2.0, players: 2, color: 'from-green-500 to-emerald-600' },
